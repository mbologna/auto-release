name: CI

"on":
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on the default branch: it may be releasing, and a cut
  # release leaves a tag without its Release.
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: ShellCheck
        run: shellcheck -s sh bin/auto-release

      # The test stage runs bats inside the image, with the git-cliff and
      # crane versions that releases will use.
      - name: Tests
        run: docker build --target test .

      # How the wrapper runs it: a root job container on a checkout owned by
      # the runner's user, which git and libgit2 refuse unless trusted.
      - name: Plan as root on the runner's checkout
        run: |
          docker build -t auto-release:ci .
          docker run --rm -v "$PWD:/w" -w /w \
            -e GITHUB_ACTIONS=true -e GITHUB_REPOSITORY -e GITHUB_SERVER_URL \
            auto-release:ci auto-release plan

  docker:
    needs: test
    # contents: the release tag and its Release; actions: dispatch the tag
    # build (a tag pushed with GITHUB_TOKEN triggers no run); the rest:
    # push, sign and scan the image.
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      security-events: write
      actions: write
    uses: mbologna/.github/.github/workflows/docker-ci.yml@bfc602f11d8228e1217398dfb3cd3fd1c0276407 # feat/image-policy
    with:
      image_name: auto-release
      # Only release tags publish the image (auto-release dispatches
      # their build); pull requests build it without pushing.
      publish: release
      push_to_dockerhub: false
      skip_paths: ""  # TEMP: force a build to test the image policy check
      # A CI job image (README, "Image policy check"): GitHub's container:
      # and GitLab's image: run the job as the image's user and write the
      # checked-out workspace, and git (tags, history) is the job.
      allowed_tools: git
      allow_root: >-
        CI job image: GitHub's container: and GitLab's image: run the job
        as the image's user, which writes the checked-out workspace
      # auto-release runs inside docker-ci: Monday's schedule releases with
      # this strategy, a push to main only a CVE fix.
      release_strategy: conventional
    secrets: inherit
