name: CI

"on":
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  security-events: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: ShellCheck
        run: shellcheck -s sh bin/auto-release

      # The test stage runs bats inside the image, with the git-cliff and
      # crane versions that releases will use.
      - name: Tests
        run: docker build --target test .

      # How the wrapper runs it: a root job container on a checkout owned by
      # the runner's user, which git and libgit2 refuse unless trusted.
      - name: Plan as root on the runner's checkout
        run: |
          docker build -t auto-release:ci .
          docker run --rm -v "$PWD:/w" -w /w \
            -e GITHUB_ACTIONS=true -e GITHUB_REPOSITORY -e GITHUB_SERVER_URL \
            auto-release:ci auto-release plan

  docker:
    needs: test
    uses: mbologna/.github/.github/workflows/docker-ci.yml@24617a5f3d3b88dce561f5504ee02f9f3d98088f # main
    with:
      image_name: auto-release
      push_to_dockerhub: false
      enable_cosign: true
      enable_release_drafter: true
    secrets: inherit

  auto-release:
    # The weekly run releases what landed since the last tag; a manual run on
    # main releases it now. The tag build it dispatches runs on the tag ref, so
    # it does not release again.
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: [docker]
    # contents: push the tag and create the Release; actions: dispatch this
    # workflow on it, since a tag pushed with GITHUB_TOKEN triggers no run.
    permissions:
      contents: write
      actions: write
    uses: mbologna/.github/.github/workflows/auto-release.yml@24617a5f3d3b88dce561f5504ee02f9f3d98088f # main
    with:
      strategy: commits
