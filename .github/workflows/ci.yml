name: CI

"on":
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on the default branch: it may be releasing, and a cut
  # release leaves a tag without its Release.
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  security-events: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: ShellCheck
        run: shellcheck -s sh bin/auto-release

      # The test stage runs bats inside the image, with the git-cliff and
      # crane versions that releases will use.
      - name: Tests
        run: docker build --target test .

      # How the wrapper runs it: a root job container on a checkout owned by
      # the runner's user, which git and libgit2 refuse unless trusted.
      - name: Plan as root on the runner's checkout
        run: |
          docker build -t auto-release:ci .
          docker run --rm -v "$PWD:/w" -w /w \
            -e GITHUB_ACTIONS=true -e GITHUB_REPOSITORY -e GITHUB_SERVER_URL \
            auto-release:ci auto-release plan

  docker:
    needs: test
    uses: mbologna/.github/.github/workflows/docker-ci.yml@eebb1ea28c9615293c30c0d067a91efc88ce3d07 # main
    with:
      image_name: auto-release
      push_to_dockerhub: false
      enable_cosign: true
      enable_release_drafter: true
    secrets: inherit

  auto-release:
    # Monday's schedule and a manual run release with the strategy below; a push
    # to the default branch releases only a CVE fix (the wrapper switches to the
    # security strategy). The tag build auto-release dispatches runs on the tag
    # ref, so it does not release again.
    if: >-
      github.event_name == 'schedule' ||
      ((github.event_name == 'workflow_dispatch' || github.event_name == 'push') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    needs: [docker]
    # contents: push the tag and create the Release; actions: dispatch this
    # workflow on it, since a tag pushed with GITHUB_TOKEN triggers no run.
    permissions:
      contents: write
      actions: write
    uses: mbologna/.github/.github/workflows/auto-release.yml@eebb1ea28c9615293c30c0d067a91efc88ce3d07 # main
    with:
      strategy: conventional
      image: ghcr.io/mbologna/auto-release
